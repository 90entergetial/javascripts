<!DOCTYPE html>
<html>
<head>
    <title>A Test Of Javascript</title>
    <style>
    body {
      font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      background: rgb(36, 29, 58);
      color: aliceblue;
      font-size: 15px;
    }
    #cav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
    }
    #d_title {
      background-color: rgb(27, 21, 43);
      width:100%;
      height: 100vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #title {
        font-size: 100px;
        font-weight: bold;
        color:aliceblue;
        margin:20px;
        width: 100%;
        text-align: center;
        overflow: scroll;
    }
    #body {
      display: block;
    }
    #body h1{
      margin: 0px 25px;
      padding: 10px;
    }
    #littledesc {
        font-size: 30px;
        font-weight: bold;
        color:rgba(255, 255, 255, 0);
        margin:20px;
        width: 100%;
        text-align: center;
        overflow: scroll;
        transition: all 2s ease-in-out;
    }
    #projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      padding: 25px;
      background-color: rgb(33, 27, 53);
    }
    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      background: rgb(27, 21, 43);
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: aliceblue;
      text-decoration: none;
      transition: transform 0.5s ease, border-color 0.5s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .card-image {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.05) center / cover no-repeat;
    }
    video.card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-info {
      position: relative;
      flex: 0 0 45%;
      box-sizing: border-box;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      background-image: linear-gradient(to top, rgba(33, 27, 53, 1), rgba(33, 27, 53, 0.6));
    }
    .card-transition {
      position: relative;
      flex: 0 0 50%;
      box-sizing: border-box;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      background-image: linear-gradient(to top, rgba(33, 27, 53, 0.6), rgba(33, 27, 53, 0));
    }
    .card-title {
      margin: 0;
      font-size: 27px;
      font-style: italic;
    }
    .card-desc {
      margin: 0;
      font-size: 15px;
      opacity: 0.8;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
    }
    .card-tags {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }
    .card-date {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0px;
      color: rgba(255, 255, 255, 0.3);
      padding-left:5px;
    }
    </style>
</head>
<body style="margin: 0px;">
    <canvas id="cav" width=100% height=100%></canvas>
    <script src="projects.js"></script>
    <script src="main.js"></script>
    <div id="d_title">
      <p id="title"></p>
      <p id="littledesc">mysertious text that you can definetly see</p>
    </div>
    <div id="body">
      <h1>Cool and amazing projects I made. Most aren't finished, but the concept is there unless you're fishing game.</h1>
      <div id="projects">
        
      </div>
    </div>
</body>
</html>
