<!DOCTYPE html>
<html>
<head>
    <title>preset</title>
    <style>
    body {
        background-color: rgb(16, 15, 15);
        font-family:monospace;
        font-weight: lighter;
        color: white;
    }
    #cav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;

    }
    #numwrap {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #number {
        font-size: 40px;
        display: flex;
    }
    #card {
        width: 50px;
        height: min-content;
        padding: 0px 2px;
        margin: 0px 5px;
        background-color: rgb(33, 32, 31);
        border-radius: 5px;
        box-shadow: 0px 0px 10px -3px rgba(255, 255, 255, 0.2);
    }
    #card h1{
        margin:0px;
        text-align: center;
    }
    #i {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 50px;

    }
    #ii {
        font-size: 25px;
        margin-top: 10px;
    }
    #evals {
        position: absolute;
        top: 32%;
        left: 50%;
        transform: translate(-50%, 0%);
        font-size: 50px;
        margin-top: 30px;

    }
    #evals h1{

        font-size: 50px;
        margin:0px;
        
    }
    #evlcrd {
        background-color: rgb(0, 0, 0);
        margin: 10px;
        width: 750px;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }
    #evlcrd h1 {
        margin:0px;
        text-align: left;
        font-size: 40px;
        width: 100%;
    }
    #evlcrd p {
        margin:0px;
        text-align: right;
        font-size: 30px;
    }
    #c_desc {
        padding: 20px;
        font-size: 20px;
    }
    #prob {
        text-align: right;
        font-size: 15px;
        color:rgb(82, 80, 80);
        height: 0px;
    }
    #num_evals {
        text-align: center;
        font-size: 25px;
    }
    </style>
</head>
<body style="margin: 0px;">
    <canvas id="cav" width=100% height=100%></canvas>
    <script src="function_presets.js"></script>
    <script src="preset_colors.js"></script>
    <script src="evalulations.js"></script>
    <script src="numgen.js"></script>
    <div id="numwrap">
        <div id="number">
        </div>
        <h id="ii">0</h>
    </div>
    <h id="i">0</h>
    <div id="evals"></div>
    
</body>
</html>
