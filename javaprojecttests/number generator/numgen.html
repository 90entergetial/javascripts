<!DOCTYPE html>
<html>
<head>
    <title>preset</title>
    <style>
    body {
        background-color: rgb(16, 15, 15);
        font-family:monospace;
        font-weight: lighter;
        color: white;
    }
    #cav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;

    }
    #numwrap {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    @property --number-color {
        syntax: "<color>";
        inherits: true;
        initial-value: rgb(38, 38, 38);
    }
    #number {
        font-size: 40px;
        display: flex;
        padding: 20px;
        --number-color: rgb(38, 38, 38);
        border: solid 2px color-mix(in srgb, var(--number-color) 0%, transparent);
        border-radius: 10px;
        position: relative;
        isolation: isolate;
    }
    #number::before {
        content: "";
        position: absolute;
        inset: -120px;          /* how far the glow reaches past the box */
        background-image: radial-gradient(closest-side,
            color-mix(in srgb, var(--number-color) 20%, transparent),
            color-mix(in srgb, var(--number-color) 0%, transparent));
        z-index: -1;
        pointer-events: none;  /* so the glow doesn't block clicks */
    }
    #pnumber {
        font-size: 40px;
        display: flex;
    }
    #card {
        width: 50px;
        height: min-content;
        padding: 0px 2px;
        margin: 0px 5px;
        border-radius: 5px;
        box-shadow: 0px 0px 10px 0px rgb(33, 32, 31);
    }
    #card h1{
        margin:0px;
        text-align: center;
    }
    #h_card_p{
        color: rgb(52, 52, 52);
        font-size: 15px;
    }
    #i {
        position: absolute;
        top: 33%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 50px;

    }
    #ii {
        font-size: 25px;
        margin-top: 10px;
    }
    #evals {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, 0%);
        font-size: 50px;
        margin-top: 30px;

    }
    #evals h1{

        font-size: 50px;
        margin:0px;
        
    }
    #evlcrd {
        background-color: rgb(0, 0, 0);
        margin: 10px;
        width: 750px;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }
    #evlcrd h1 {
        margin:0px;
        text-align: left;
        font-size: 40px;
        width: 100%;
    }
    #evlcrd p {
        margin:0px;
        text-align: right;
        font-size: 30px;
    }
    #c_desc {
        padding: 20px;
        font-size: 20px;
    }
    #prob {
        text-align: right;
        font-size: 15px;
        color:rgb(82, 80, 80);
        height: 0px;
    }
    #num_evals {
        text-align: center;
        font-size: 25px;
    }
    #history {
        position: absolute;
        bottom: 5px;
        right: 5px;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        background: rgb(38, 38, 38);
        box-shadow: 0px 0px 10px 0px rgb(33, 32, 31);
        border-radius: 5px;
        pointer-events: all;
        cursor: pointer;
        transition: all 0.5s;
        text-align: center;
    }
    #history:hover {
        background: rgb(57, 57, 57);
    }
    #history h1 {
        font-size: 40px;
        transform: translate(0%, -50%);
    }
    #ui_history, #ui_history_detail {
        position: absolute;
        top: 50%;
        right: 50%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        /* both boxes read the same size from these variables (set by the resize code in numgen.js) */
        width: var(--history-w, 500px);
        height: var(--history-h, 700px);
        min-width: 300px;
        min-height: 300px;
        max-width: 90vw;
        max-height: 90vh;
        background: rgb(38, 38, 38);
        box-shadow: 0px 0px 10px 0px rgb(33, 32, 31);
        transform: translate(50%, -50%);
        padding: 10px;
        border-radius: 5px;
        border: solid rgba(255, 255, 255, 0.1) 5px;
    }
    #ui_history_detail {
        display: none;
        z-index: 1;
    }
    #history_list, #history_detail_list {
        top: 50%;
        right: 50%;
        display: flex;
        height: 100%;
        width: 100%;
        background: rgb(29, 29, 29);
        box-shadow: 0px 0px 10px 0px rgb(33, 32, 31);
        border-radius: 5px;
        border: solid rgba(0, 0, 0, 0.1) 1px;
        overflow: scroll;
        flex-direction: column;
    }
    #ui_history p {
        padding: 0px 0px;
        margin: 5px 5px;
        font-weight: lighter;
        font-size: 20px;
    }
    #history_list h1, #history_detail_list h1{
        padding: 0px 5px;
        margin: 0px 5px;
        font-weight: lighter;
    }
    .history_card {
        flex-shrink: 0;
        padding: 5px;
        margin: 5px;
        top: 50%;
        right: 50%;
        display: flex;
        height: 150px;
        background: rgb(29, 29, 29);
        border-radius: 5px;
        border: solid rgba(0, 0, 0, 0.15) 3px;
        flex-direction: column;
        font-weight: lighter;
        overflow: hidden;
        cursor: pointer;
    }
    .history_card.expanded {
        flex: 1;
        height: auto;
        min-height: 0;
        cursor: default;
    }
    .h_num {
        display: flex;
        flex-direction: row;
        flex-shrink: 0;
        overflow-x: auto;
    }
    .h_evals {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
    }
    .h_card {
        width: 30px;
        height: min-content;
        padding: 0px 2px;
        margin: 5px 3px;
        border-radius: 5px;
    }
    .h_card h1{
        transform: translate(-50%, 0%);
        padding: 0px;
        margin:0px;
        text-align: center;
        font-size: 50px;
        font-weight: bold;
    }
    .divider {
        flex-shrink: 0;
        height: 1px;
        background-color: rgba(255, 255, 255, 0.1);
        margin-bottom: 10px;
    }

    /* dropdown */
    #dropdown {
        display: flex;
        align-items: center;
        position: relative;
    }
    .dd-content {
        display: none;
        flex-direction: column;
        position: fixed;
        right: 10px;
        top: 39px;
        background-color: none;
        z-index: 2;
    }
    #dd-button {
        font-family:monospace;
        font-weight: lighter;
        width: 150px;
        height: 25px;
        background-color: rgb(29, 29, 29);
        border-radius: 3px;
        position: fixed;
        right:10px;
        border: solid rgba(0, 0, 0, 0.15) 1px;
        align-items: center;
        justify-content: center;
        display: flex;
        font-size: 15px;
        color:white;
    }
    .dd-content a {
        background-color: rgb(29, 29, 29);
        border: solid rgba(0, 0, 0, 0.15) 2px;
        width: 150px;
        border-radius: 3px;
        height: 25px;
        align-items: center;
        justify-content: center;
        display: flex;
        font-size:14px;
    }
    #dd-button:hover{
        background-color: rgb(33, 33, 33);
    }
    .dd-content a:hover {
        background-color: rgb(33, 33, 33);
    }
    #ui_toparea {
        display: flex;
        align-items: center;
    }
    #dropdown:hover .dd-content {
        display: flex;
    }

    </style>
</head>
<body style="margin: 0px;">
    <canvas id="cav" width=100% height=100%></canvas>
    <script src="function_presets.js"></script>
    <script src="preset_colors.js"></script>
    <script src="evalulations.js"></script>
    <script src="numgen.js"></script>
    <div id="numwrap">
        <div id="number">
        </div>
        <h id="ii">0</h>
    </div>
    <h id="i">0</h>
    <div id="evals"></div>
    <div id="pnumber"></div>
    <div id="history"><h1>H</h1></div>
    <div id="ui_history">
        <div id="ui_toparea">
            <p id="CIH">0 cards in history</p>
            <div id="dropdown">
                <button id="dd-button">By date-</button>
                <div class="dd-content">
                    <a>By date+</a>
                    <a>By date-</a>
                    <a>By rarity+</a>
                    <a>By rarity-</a>
                    <a>By evals+</a>
                    <a>By evals-</a>
                </div>
            </div>
        </div>

        <div id="history_list"></div>
    </div>
    <div id="ui_history_detail">
        <div id="history_detail_list"></div>
    </div>
    
</body>
</html>
