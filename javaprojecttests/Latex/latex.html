<!DOCTYPE html>
<html>
<head>
    <title>lay tex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <style>
    #cav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    p {
        position: relative; 
        top:10px;
        z-index: 1;
        color: white; 
        padding: 5px 20px;
        font-family: monospace, sans-serif;
        font-weight: bold;
        margin:0px;
    }
    #container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        color: white;
        font-size: 2em;
        text-align: center;
        pointer-events: none;
    }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <canvas id="cav" width=100% height=100%></canvas>
    <script src="latex.js"></script>
    <div id="container"></div>
</body>
</html>
