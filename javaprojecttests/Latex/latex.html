<!DOCTYPE html>
<html>
<head>
    <title>lay tex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <style>
    body {
        background-color: rgb(10, 10, 42);
    }
    #container {
        padding: 10px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        color: white;
        font-size: 50px;
        text-align: center;
        pointer-events: none;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 100%);
    }
    #answer {
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        color: white;
        font-size: 20px;
        text-align: center;
        pointer-events: none;
        transition:all 0.3s ease-in-out;
    }
    #list {
        position: absolute;
        top: -5px;
        right: -5px;
        z-index: 1;
        width: 250px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: white;
        pointer-events: none;
    }
    .list-item {
        overflow: hidden;
        white-space: nowrap;
        padding: 10px 9px;
        font-size: 1.5em;
    }
    #list .list-item:nth-child(odd) {
        border-radius: 10px 10px 0 0;
        background-color: rgba(255, 255, 255, 0.02);
    }
    #nextButton {
        background-color: rgba(255, 255, 255, 0.08);
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
        width: 100px;
        height: 50px;
        font-size: 1.2em;
        transition: all 0.1s ease-in-out;
    }
    #nextButton:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }
    #nextButton:active {
        background-color: rgba(255, 255, 255, 0.09);
    }
    #buttons {
        position: absolute;
        top: 90%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
    }
    #stats {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        color: rgb(255, 255, 255, 0.4);
        font-size: 1.5em;
    }
    #input {
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        color: white;
        font-size: 20px;
        text-align: center;
        color: rgba(255, 255, 255, 0);
        pointer-events: auto;
        background-color: rgba(255, 255, 255, 0.01);
        border: none;
        border-radius: 5px;
        padding: 10px;
        width: 300px;
        transition: all 0.1s ease-in-out;
    }
    #input:focus {
        outline: none;
        background-color: rgba(255, 255, 255, 0.05);
    }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <script src="latex.js"></script>
    <div id="stats">
        <p1 id="stage">Stage: Undetermined</p1>
    </div>
    <div id="container"></div>
    <div id="answer"></div>
    <input type="text" id="input" placeholder=" ">
    <div id="list"></div>
    <div id="buttons">
        <button id="nextButton">Skip</button>
    </div>
</body>
</html>
