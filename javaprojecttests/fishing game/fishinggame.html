<!DOCTYPE html>
<html>
<head>
    <title>the fisher</title>
    <style>
    body {
        background-color: rgb(76, 174, 174);
    }
    #cav {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    p {
        position: relative; 
        top:10px;
        z-index: 1;
        color: white; 
        padding: 5px 20px;
        font-family: monospace, sans-serif;
        font-weight: bold;
        margin:0px;
    }
    #grid {
        position:absolute;
        z-index: 1;
        left: 50%;
        top: 50%;
        width: 100%;
        pointer-events: none;
    }
    #column {
        position: relative;
        display: flex;
        justify-content: center;
        pointer-events: none;
    }
    #square {
        background-color: rgb(85, 192, 192);
        width: 50px;
        height: 50px;
        cursor: pointer;
        margin: 5px;
        pointer-events: all;
    }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <canvas id="cav" width=100% height=100%></canvas>
    <script src="function_presets.js"></script>
    <script src="fishinggame.js"></script>
    <div id="grid"></div>
</body>
</html>
